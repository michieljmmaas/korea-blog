name: CI
on:
  pull_request:
  schedule:
    # Weekly, so advisories published while the repo is idle still surface.
    - cron: '0 6 * * 1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Dev-only tooling (tailwind, postcss, ...) isn't shipped in the static export.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
