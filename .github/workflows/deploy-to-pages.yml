name: Update Content and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Adjust to your default branch if different

  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if commit message contains '[deploy]' or if manually triggered
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch'

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pull the full-size photo set (thumb + display tiers) from the rolling
      # "images" release instead of committing ~2GB of photos to the repo.
      # The release is public (the repo is public), so the asset is an
      # AES-256 encrypted 7z archive with encrypted headers; the password
      # lives only in the IMAGES_ARCHIVE_PASSWORD repository secret.
      - name: Download photo release
        env:
          IMAGES_ARCHIVE_PASSWORD: ${{ secrets.IMAGES_ARCHIVE_PASSWORD }}
        run: |
          if [ -z "$IMAGES_ARCHIVE_PASSWORD" ]; then
            echo "::error::IMAGES_ARCHIVE_PASSWORD secret is not set"
            exit 1
          fi
          mkdir -p /tmp/images-release
          gh release download images --pattern '*.7z' --dir /tmp/images-release --clobber
          mkdir -p public/photos
          7z x -y -p"$IMAGES_ARCHIVE_PASSWORD" -opublic/photos /tmp/images-release/*.7z > /dev/null

      # Entity-cover thumbnails are cropped from the display tier downloaded
      # above; only new days/weeks/blogs get a thumbnail generated.
      - name: Generate thumbnails
        id: static-generate-thumbnails
        continue-on-error: false
        run: npm run thumbnails

      - name: Update stats
        id: static-update-stats
        continue-on-error: false
        run: npm run extract-stats

      - name: Commit updated thumbnails and charts
        if: steps.static-generate-thumbnails.outcome == 'success' && steps.static-update-stats.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update thumbnails and/or chart data'

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
