name: Update Content and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Adjust to your default branch if different

  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if commit message contains '[deploy]' or if manually triggered
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch'

    env:
      IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
      IMAGE_KIT_PRIVATE_KEY: ${{ secrets.IMAGE_KIT_PRIVATE_KEY }}
      IMAGE_KIT_PUBLIC_KEY: ${{ secrets.IMAGE_KIT_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Static content update steps (entity-cover thumbnails only; still ImageKit-sourced)
      - name: Generate thumbnails
        id: static-generate-thumbnails
        continue-on-error: false
        run: npm run thumbnails && npm run thumbnails-front-page

      - name: Update stats
        id: static-update-stats
        continue-on-error: false
        run: npm run extract-stats

      - name: Commit updated thumbnails and charts
        if: steps.static-generate-thumbnails.outcome == 'success' && steps.static-update-stats.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update thumbnails and/or chart data'

      # Pull the full-size photo set (thumb + display tiers) from the rolling
      # "images" release instead of committing ~2GB of photos to the repo.
      - name: Download photo release
        run: |
          mkdir -p /tmp/images-release
          gh release download images --pattern '*.zip' --dir /tmp/images-release --clobber
          mkdir -p public/photos
          unzip -o /tmp/images-release/*.zip -d public/photos

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
